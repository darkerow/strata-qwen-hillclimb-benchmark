<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hill Rider — hill climb driving game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="topbtns">
    <button id="soundbtn" type="button" title="Sound on/off">SOUND: ON</button>
    <button id="garagebtn" type="button" title="Garage upgrades">GARAGE</button>
  </div>

  <div id="ui">
    <div id="panel">
      <div class="brand">HILL RIDER</div>
      <div class="row"><span class="lbl">Distance</span><span id="dist">0 m</span></div>
      <div class="row"><span class="lbl">Best</span><span id="best">0 m</span></div>
      <div class="row"><span class="lbl">Coins</span><span id="coins">0</span></div>
      <div class="bar"><div id="fuelbar"></div></div>
      <div class="row small"><span id="fueltext">fuel 100%</span><span id="statename">drive</span></div>
    </div>

    <div id="hint">
      <div><b>Gas</b> — Right / D &nbsp; <b>Brake</b> — Left / A</div>
      <div><b>P</b> pause &nbsp; <b>R</b> restart &nbsp; <b>M</b> sound &nbsp; <b>G</b> garage</div>
    </div>

  </div>

  <div id="pedals">
    <button id="brakePedal" class="pedal left" type="button">&#9664; BRAKE</button>
    <button id="gasPedal" class="pedal right" type="button">GAS &#9654;</button>
  </div>

  <div id="overlay" class="hidden">
    <div id="card">
      <h1 id="title">Ready to drive</h1>
      <p id="msg">press P to continue</p>
      <button id="mainbtn" type="button">Continue</button>
    </div>
  </div>

  <div id="garage" class="hidden">
    <div id="gcard">
      <h1>Garage</h1>
      <p id="gmsg">Upgrades are saved locally.</p>
      <div id="upgrades"></div>
      <button id="garageclose" type="button">Close garage</button>
    </div>
  </div>

  <div id="debug"></div>
</div>
<script src="game.js"></script>
</body>
</html>
